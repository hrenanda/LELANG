<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Aset - LelangKu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="container">
    <a href="index.html" class="navbar-brand">
      <div class="logo-icon">LK</div>
      LelangKu
    </a>
    <div class="navbar-nav" id="navLinks">
      <a href="index.html">Beranda</a>
      <a href="katalog.html" class="active">Katalog</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
    <div class="navbar-actions" id="navActions">
      <a href="login.html" class="btn btn-ghost">Masuk</a>
      <a href="register.html" class="btn btn-primary">Daftar</a>
    </div>
  </div>
</nav>

<div style="padding-top:90px;padding-bottom:40px;background:var(--white);border-bottom:1px solid var(--gray-100);">
  <div class="container">
    <div class="page-header" style="margin-bottom:20px;">
      <h1>Katalog Aset Kendaraan</h1>
      <p>Temukan kendaraan pilihan Anda dan ikuti lelang secara real-time.</p>
    </div>
    <div class="katalog-filters">
      <div class="filter-group">
        <select id="filterStatus">
          <option value="all">Semua Status</option>
          <option value="live">🔴 Sedang Lelang</option>
          <option value="upcoming">🟡 Akan Datang</option>
          <option value="ended">⚫ Selesai</option>
        </select>
      </div>
      <div class="filter-group">
        <select id="filterGrade">
          <option value="all">Semua Grade</option>
          <option value="A">Grade A</option>
          <option value="B">Grade B</option>
          <option value="C">Grade C</option>
        </select>
      </div>
      <div class="filter-group">
        <select id="filterLocation">
          <option value="all">Semua Lokasi</option>
          <option value="Jakarta">Jakarta</option>
          <option value="Tangerang">Tangerang</option>
          <option value="Bekasi">Bekasi</option>
          <option value="Depok">Depok</option>
        </select>
      </div>
      <div class="filter-group" style="margin-left:auto;">
        <input type="text" id="filterSearch" placeholder="Cari kendaraan..." style="width:220px;">
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="container">
    <div class="katalog-grid" id="katalogGrid"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      &copy; 2026 PT Multinet Perkasa. All rights reserved.
    </div>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  function updateNav() {
    const user = getCurrentUser();
    const actions = document.getElementById('navActions');
    if (user && actions) {
      const dash = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      actions.innerHTML = `<a href="${dash}" class="btn btn-ghost">Dashboard</a><button onclick="logout()" class="btn btn-primary btn-sm">Keluar</button>`;
    }
  }
  updateNav();

  function renderKatalog() {
    const db = getDB();
    const status = document.getElementById('filterStatus').value;
    const grade = document.getElementById('filterGrade').value;
    const location = document.getElementById('filterLocation').value;
    const search = document.getElementById('filterSearch').value.toLowerCase();

    let filtered = db.vehicles.filter(v => {
      if (status !== 'all' && v.status !== status) return false;
      if (grade !== 'all' && v.grade !== grade) return false;
      if (location !== 'all' && !v.location.toLowerCase().includes(location.toLowerCase())) return false;
      if (search && !v.name.toLowerCase().includes(search)) return false;
      return true;
    });

    const grid = document.getElementById('katalogGrid');
    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--gray-light);">Tidak ada kendaraan ditemukan.</div>';
      return;
    }

    filtered.forEach(v => {
      const remaining = v.bidEnd - Date.now();
      const statusLabel = v.status === 'live' ? 'Lelang Berlangsung' : v.status === 'upcoming' ? 'Akan Datang' : 'Selesai';
      const statusColor = v.status === 'live' ? 'background:var(--danger)' : v.status === 'upcoming' ? 'background:var(--accent)' : 'background:var(--gray)';
      grid.innerHTML += `
        <div class="katalog-card">
          <div class="katalog-card-img">
            <span class="placeholder-car">${v.img}</span>
            <span class="grade-badge grade-${v.grade.toLowerCase()}">Grade ${v.grade}</span>
            ${v.status === 'live' ? `<span class="timer-badge">⏱ ${formatTimer(remaining)}</span>` : ''}
          </div>
          <div class="katalog-card-body">
            <h3>${v.name}</h3>
            <div class="katalog-card-specs">
              <div class="spec">📅 <strong>${v.year}</strong></div>
              <div class="spec">📏 <strong>${v.km.toLocaleString('id-ID')} km</strong></div>
              <div class="spec">📄 BPKB: <strong>${v.bpkb}</strong></div>
              <div class="spec">📋 STNK: <strong>${v.stnk}</strong></div>
              <div class="spec">📍 <strong>${v.location}</strong></div>
              <div class="spec">🔨 <strong>${v.bids.length} bid</strong></div>
            </div>
            <div class="katalog-card-price">
              <div>
                <div class="price-label">${v.status === 'ended' ? 'Harga Final' : 'Harga Saat Ini'}</div>
                <div class="price-val">${formatRp(v.currentPrice)}</div>
                ${v.status !== 'ended' ? `<div class="bid-count">Mulai: ${formatRp(v.startPrice)}</div>` : ''}
              </div>
              ${v.status !== 'ended' ?
                `<a href="bidding.html?id=${v.id}" class="btn btn-sm btn-primary">${v.status === 'live' ? 'Bid Sekarang' : 'Lihat Detail'}</a>` :
                `<span class="badge badge-gray">Selesai</span>`
              }
            </div>
          </div>
        </div>`;
    });
  }

  document.getElementById('filterStatus').addEventListener('change', renderKatalog);
  document.getElementById('filterGrade').addEventListener('change', renderKatalog);
  document.getElementById('filterLocation').addEventListener('change', renderKatalog);
  document.getElementById('filterSearch').addEventListener('input', renderKatalog);

  renderKatalog();
</script>
</body>
</html>
